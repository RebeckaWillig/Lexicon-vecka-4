
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Forms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Anmäl dig till vår workshop</h1>

    <!-- action tells us where the info is sent (for this example we leave this empty) -->
    <!-- method: get works for now but not for things like passwords and card details (POST for that) -->
    <form action="" method="get">
      <div>
        <!-- label's for points to input's id -->
        <label for="name">Namn</label>
        <input type="text" id="name" name="name" aria-describedby="name-help"
          placeholder="John Doe" required minlength="3" maxlength="30" autocomplete="name">
        <p id="name-help">Ange ditt för- och efternamn</p>
      </div>

      <div>
        <label for="email">E-postadress</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required autocomplete="email">
      </div>

      <div>
        <!-- attribute checked caused the checkbox to be pre-checked -->
        <input type="checkbox" id="newsletter" name="newsletter" checked>
        <label for="newsletter">
          Jag vill få information om kommande workshops
        </label>
      </div>

      <fieldset>
        <legend>Vilken erfarenhetsnivå har du?</legend>
        <div>
          <input type="radio" id="beginner" name="experience" value="beginner">
          <label for="beginner">Nybörjare</label>
        </div>
        <div>
          <input type="radio" id="intermediate" name="experience" value="intermediate">
          <label for="intermediate">Har lite erfarenhet</label>
        </div>
        <div>
          <input type="radio" id="advanced" name="experience" value="advanced">
          <label for="advanced">Erfaren</label>
        </div>
      </fieldset>

      <div>
        <label for="workshop">Välj workshop</label>
        <select id="workshop" name="workshop">
          <option value="">Välj ett alternativ</option>
          <option value="html">HTML och CSS</option>
          <option value="javascript">Javascript</option>
          <option value="accessibility">Tillgänglighet</option>
        </select>
      </div>

      <div>
        <label for="message">Övrig information</label>
        <textarea id="message" name="message" rows="4" cols="40"></textarea>
      </div>

      <button type="submit">Skicka anmälan</button>
    </form>
  </main>
</body>
</html>
